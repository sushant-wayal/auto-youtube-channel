                }

                const charsRemainingToShow = visibleChars - charCount;
                if (charsRemainingToShow <= 0) break;

                const lineLength = rawLine.length;
                const charsToShowOnThisLine = Math.min(charsRemainingToShow, lineLength);
                const visibleLineText = rawLine.substring(0, charsToShowOnThisLine);

                let offsetX = codeX;

                if (a.showLineNumbers !== false) {
                    ctx.font = "500 " + fontSize + "px 'JetBrains Mono', monospace";
                    ctx.fillStyle = darkTheme ? "#31394d" : "#94A3B8";
                    ctx.textAlign = "right";
                    ctx.textBaseline = "alphabetic";
                    ctx.fillText(String(i + 1), codeX + 24, lineY);
                    offsetX += 40;
                }

                const tokens = tokenizeLine(rawLine, language);
                let cursorX = offsetX;
                let renderedChars = 0;

                for (const token of tokens) {
                    if (renderedChars >= charsToShowOnThisLine) break;

                    const charsToRenderFromToken = Math.min(token.value.length,
                        charsToShowOnThisLine - renderedChars);
                    const partialTokenValue = token.value.substring(0, charsToRenderFromToken);

                    if (partialTokenValue) {
                        ctx.font = "500 " + fontSize + "px 'JetBrains Mono', monospace";
                        ctx.textAlign = "left";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = getTokenColor(token.type, darkTheme);
                        ctx.fillText(partialTokenValue, cursorX, lineY);
                        cursorX += ctx.measureText(partialTokenValue).width;
                    }

                    renderedChars += charsToRenderFromToken;
                }

                if (charsToShowOnThisLine > 0) {
                    lastVisibleLine = i;
                    lastVisibleLineText = visibleLineText;
                    lastVisibleLineX = cursorX;
                    currentLineNumber = i;
                }

                charCount += lineLength;
            }

            if (a.cursor !== false && lastVisibleLine >= 0 && visibleChars < totalChars) {
                const blinkOn = Math.floor(CURRENT_TIME * 2.5) % 2 === 0;

                if (blinkOn) {
                    const cursorY = codeY + lastVisibleLine * lineHeight;
                    ctx.strokeStyle = darkTheme ? "#6366f1" : "#1D4ED8";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(lastVisibleLineX, cursorY - fontSize);
                    ctx.lineTo(lastVisibleLineX, cursorY + 2);
                    ctx.stroke();
                }
            }

            resetStyles();
        }

        /* ========================================================== */
        /* PRIMITIVE: PROGRESS BAR                                    */
        /* ========================================================== */

        function drawProgressBar(a, p) {
            const reveal = ease(p, "easeOut");
            const max = Math.max(1, a.max || 100);
            const targetRatio = clamp((a.value || 0) / max, 0, 1);
            const currentRatio = targetRatio * reveal;
            const r = a.r || Math.min(14, a.h / 2);
            const fillW = Math.max(0, a.w * currentRatio);

            roundedRectPath(a.x, a.y, a.w, a.h, r);
            ctx.fillStyle = a.trackFill || (isDarkTheme ? "#131b2e" : "#E2E8F0");
            ctx.fill();

            if (a.stroke !== false) {
                ctx.strokeStyle = a.stroke || (isDarkTheme ? "#31394d" : "#CBD5E1");
                ctx.lineWidth = a.strokeWidth || 1.5;
                ctx.stroke();
            }

            if (a.fill !== false && fillW > 0) {
                roundedRectPath(a.x, a.y, fillW, a.h, r);
                ctx.fillStyle = a.fill || theme.accent;
                ctx.fill();
            }

            const percent = Math.round(currentRatio * 100);
            ctx.font = "600 " + (IS_SHORTS ? 22 : 16) + "px 'Inter', sans-serif";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = theme.textSecondary;
            ctx.fillText(percent + "%", a.x + a.w, a.y - 10);

            if (a.label) {
                ctx.textAlign = "left";
                ctx.fillStyle = theme.textPrimary;
                ctx.fillText(a.label, a.x, a.y - 10);
            }

            resetStyles();
        }

        /* ========================================================== */
        /* PRIMITIVE: BADGE / CHIP                                    */
        /* ========================================================== */

        function drawBadge(a, p) {
            const reveal = ease(p, "easeOut");
            const fontSize = a.fontSize || (IS_SHORTS ? 22 : 15);
            const paddingX = a.paddingX || Math.round(fontSize * 0.8);
            const paddingY = a.paddingY || Math.round(fontSize * 0.5);
            const text = String(a.value || "");
            const style = a.style || "neutral";

            const styleMap = {
                neutral: {
                    fill: isDarkTheme ? "#131b2e" : "#E5E7EB", stroke: isDarkTheme ? "#31394d" : "#CBD5E1", text: isDarkTheme ? "#c0c4d6" : "#334155"
                }

                ,
                accent: {
                    fill: isDarkTheme ? "rgba(99,102,241,0.15)" : "#E0E7FF", stroke: isDarkTheme ? "#6366f1" : "#A5B4FC", text: isDarkTheme ? "#e5e7f1" : "#3730A3"
                }

                ,
                warning: {
                    fill: isDarkTheme ? "rgba(251,191,36,0.15)" : "#FEF3C7", stroke: isDarkTheme ? "#FBBF24" : "#F59E0B", text: isDarkTheme ? "#FDE68A" : "#92400E"
                }

                ,
                success: {
                    fill: isDarkTheme ? "rgba(34,197,94,0.15)" : "#DCFCE7", stroke: isDarkTheme ? "#22C55E" : "#22C55E", text: isDarkTheme ? "#bbf7d0" : "#166534"
                }

                ,
                danger: {
                    fill: isDarkTheme ? "rgba(239,68,68,0.15)" : "#FEE2E2", stroke: isDarkTheme ? "#EF4444" : "#EF4444", text: isDarkTheme ? "#fecaca" : "#991B1B"
                }
            }

                ;
            const colors = styleMap[style] || styleMap.neutral;

            ctx.font = (a.fontWeight || 600) + " " + fontSize + "px 'Inter', sans-serif";
            const textWidth = ctx.measureText(text).width;
            const iconExtra = a.icon ? fontSize * 1.15 : 0;
            const w = textWidth + paddingX * 2 + iconExtra;
            const h = fontSize + paddingY * 2;
            const x = a.x;
            const y = a.y;

            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            ctx.scale(0.96 + 0.04 * reveal, 0.96 + 0.04 * reveal);
            ctx.translate(-(x + w / 2), -(y + h / 2));

            roundedRectPath(x, y, w, h, h / 2);
            ctx.fillStyle = a.fill || colors.fill;
            ctx.fill();
            ctx.strokeStyle = a.stroke || colors.stroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            let textX = x + paddingX;

            if (a.icon) {
                drawIcon({
                    x: x + paddingX + fontSize * 0.45, y: y + h / 2, name: a.icon, size: fontSize * 0.8, stroke: colors.text, strokeWidth: 2
                }

                    , 1);
                textX += iconExtra;
            }

            ctx.fillStyle = a.textColor || colors.text;
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(text, textX, y + h / 2);

            ctx.restore();
            resetStyles();
        }

        /* ========================================================== */
        /* PRIMITIVE: ICON                                            */
        /* ========================================================== */

        function drawIcon(a, p) {
            const reveal = ease(p, "easeOut");
            const size = a.size || (IS_SHORTS ? 44 : 28);
            const pathData = ICON_PATHS[a.name] || ICON_PATHS.info;
            const iconPath = new Path2D(pathData);

            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.scale((size / 24) * (0.9 + 0.1 * reveal), (size / 24) * (0.9 + 0.1 * reveal));
            ctx.translate(-12, -12);

            if (a.fill && a.fill !== false) {
                ctx.fillStyle = a.fill;
                ctx.fill(iconPath);
            }

            ctx.strokeStyle = a.stroke || theme.accent;
            ctx.lineWidth = a.strokeWidth || 2;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke(iconPath);
            ctx.restore();
            resetStyles();
        }

        /* ========================================================== */
        /* PRIMITIVE: TABLE                                           */
        /* ========================================================== */

        function drawTable(a, p) {
            const reveal = ease(p, "easeOut");
            const headers = Array.isArray(a.headers) ? a.headers : [];
            const rows = Array.isArray(a.rows) ? a.rows : [];
            const cols = Math.max(1, headers.length || (rows[0] ? rows[0].length : 1));
            const rowCount = Math.max(1, rows.length + 1);
            const colW = a.w / cols;
            const rowH = a.h / rowCount;
            const visibleRows = Math.max(1, Math.floor((rows.length + 1) * reveal));
            const fontSize = a.fontSize || (IS_SHORTS ? 20 : 14);

            roundedRectPath(a.x, a.y, a.w, a.h, 12);
            ctx.fillStyle = isDarkTheme ? "#0b1326" : "#FFFFFF";
            ctx.fill();
            ctx.strokeStyle = a.gridStroke || (isDarkTheme ? "#31394d" : "#CBD5E1");
            ctx.lineWidth = 1;
            ctx.stroke();

            roundedRectPath(a.x, a.y, a.w, rowH, 12);
            ctx.fillStyle = a.headerFill || (isDarkTheme ? "#131b2e" : "#E2E8F0");
            ctx.fill();

            for (let r = 1; r < Math.min(rowCount, visibleRows); r++) {
                if (a.striped !== false && r % 2 === 0) {
                    ctx.fillStyle = isDarkTheme ? "rgba(49,57,77,0.3)" : "rgba(148,163,184,0.08)";
                    ctx.fillRect(a.x, a.y + r * rowH, a.w, rowH);
                }
            }

            ctx.strokeStyle = a.gridStroke || (isDarkTheme ? "#31394d" : "#CBD5E1");

            for (let c = 1; c < cols; c++) {
                const x = a.x + c * colW;
                ctx.beginPath();
                ctx.moveTo(x, a.y);
                ctx.lineTo(x, a.y + a.h);
                ctx.stroke();
            }

            for (let r = 1; r < Math.min(rowCount, visibleRows); r++) {
                const y = a.y + r * rowH;
                ctx.beginPath();
                ctx.moveTo(a.x, y);
                ctx.lineTo(a.x + a.w, y);
                ctx.stroke();
            }

            const align = a.align || "left";
            ctx.font = "600 " + fontSize + "px 'Inter', sans-serif";
            ctx.fillStyle = a.textColor || (isDarkTheme ? "#e5e7f1" : "#0F172A");
            ctx.textBaseline = "middle";

            for (let c = 0; c < cols; c++) {
                const text = String(headers[c] || "");
                const cellX = a.x + c * colW;
                const tx = align === "center" ? cellX + colW / 2 : align === "right" ? cellX + colW - 16 : cellX + 16;
                ctx.textAlign = align;
                ctx.fillText(text, tx, a.y + rowH / 2);
            }

            ctx.font = "500 " + fontSize + "px 'JetBrains Mono', monospace";
            ctx.fillStyle = a.textColor || (isDarkTheme ? "#e5e7f1" : "#0F172A");

            // Render visible rows
            for (let r = 0; r < Math.min(rows.length, Math.max(0, visibleRows - 1)); r++) {
                const row = rows[r] || [];

                for (let c = 0; c < cols; c++) {
                    const cellText = String(row[c] || "");
                    const cellX = a.x + c * colW;
                    const tx = align === "center" ? cellX + colW / 2 : align === "right" ? cellX + colW - 16 : cellX + 16;
                    ctx.textAlign = align;
                    ctx.fillText(cellText, tx, a.y + (r + 1) * rowH + rowH / 2);
                }
            }

            resetStyles();
        }

        function drawNumberCounter(a, p) {
            const reveal = ease(p, "easeOut");
            const n = lerp(a.from || 0, a.to || 0, reveal);
            const safeDecimals = Math.max(0, Math.min(4, a.decimals || 0));
            const display = (a.prefix || "") + Number(n).toFixed(safeDecimals) + (a.suffix || "");
            const fontSize = getFontSize(a.fontSize || a.size || "title");
            const fontWeight = a.fontWeight || 700;

            ctx.font = fontWeight + " " + fontSize + "px 'Inter', sans-serif";
            ctx.textAlign = a.align || "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = a.fill || theme.accent;
            ctx.fillText(display, a.x, a.y);
            resetStyles();
        }

        function drawHighlight(a, p) {
            const reveal = ease(p, "easeOut");
            const opacity = clamp((a.opacity !== undefined ? a.opacity : 0.35) * reveal, 0, 1);
            const fill = a.fill || "#FDE68A";

            ctx.globalAlpha = opacity;
            ctx.fillStyle = fill;

            if (a.style === "underline") {
                const underlineH = Math.max(4, Math.min(14, a.h || 8));
                roundedRectPath(a.x, a.y + (a.h || underlineH) - underlineH, a.w, underlineH, underlineH / 2);
                ctx.fill();
            } else {
                roundedRectPath(a.x, a.y, a.w, a.h, a.r || 8);
                ctx.fill();
            }

            resetStyles();
        }

        function drawTransform(a, p) {
            ctx.save();

            const progress = ease(p, "easeOut");
            if (a.translate) {
                ctx.translate(a.translate[0] * progress, a.translate[1] * progress);
            }

            if (a.children) {
                a.children.forEach(child => draw(child, p));
            }

            ctx.restore();
            resetStyles();
        }

        function drawGroup(a, p) {
            if (a.children) {
                a.children.forEach(child => draw(child, p));
            }
        }

        function draw(a, p) {
            switch (a.op) {
                case "line": return drawLine(a, p);
                case "rect": return drawRect(a, p);
                case "ellipse": return drawEllipse(a, p);
                case "path": return drawPath(a, p);
                case "text": return drawText(a, p);
                case "codeBlock": return drawCodeBlock(a, p);
                case "progressBar": return drawProgressBar(a, p);
                case "badge": return drawBadge(a, p);
                case "icon": return drawIcon(a, p);
                case "table": return drawTable(a, p);
                case "numberCounter": return drawNumberCounter(a, p);
                case "highlight": return drawHighlight(a, p);
                case "group": return drawGroup(a, p);
                case "transform": return drawTransform(a, p);
            }
        }

        function renderSceneFrame(time) {
            CURRENT_TIME = time;
            drawBackground();

            for (const a of actions) {
                if (time < a.t) continue;
                if (a.op === "text" && a.endT !== undefined && time > a.endT) continue;

                const duration = a.dur || scale.baseDuration;
                const raw = Math.min(1, (time - a.t) / duration);
                const p = ease(raw, a.easing || "easeOut");

                draw(a, p);
            }
        }

        window.renderFrame = renderSceneFrame;

        const scrubber = typeof document !== "undefined" ? document.getElementById("timeScrubber") : null;
        const playPause = typeof document !== "undefined" ? document.getElementById("playPause") : null;
        const readout = typeof document !== "undefined" ? document.getElementById("timeReadout") : null;
        let isPlaying = true;
        let startMs = performance.now();
        let pausedTime = 0;
        let currentSceneTime = 0;

        function setReadout(time) {
            if (readout) readout.textContent = time.toFixed(2) + "s";
            if (scrubber) scrubber.value = String(time);
        }

        function setSceneTime(time) {
            const clamped = clamp(time, 0, SCENE_DURATION);
            pausedTime = clamped;
            currentSceneTime = clamped;
            renderSceneFrame(clamped);
            setReadout(clamped);
        }

        function tick(now) {
            if (isPlaying) {
                const elapsed = ((now - startMs) / 1000) % SCENE_DURATION;
                currentSceneTime = elapsed;
                renderSceneFrame(elapsed);
                setReadout(elapsed);
            }
            requestAnimationFrame(tick);
        }

        if (scrubber) {
            scrubber.max = String(SCENE_DURATION);
            scrubber.addEventListener("input", () => {
                isPlaying = false;
                if (playPause) playPause.textContent = "Play";
                setSceneTime(Number(scrubber.value));
            });
        }

        if (playPause) {
            playPause.addEventListener("click", () => {
                isPlaying = !isPlaying;
                playPause.textContent = isPlaying ? "Pause" : "Play";
                if (isPlaying) {
                    startMs = performance.now() - pausedTime * 1000;
                } else {
                    pausedTime = currentSceneTime;
                }
            });
        }

        renderSceneFrame(0);
        requestAnimationFrame(tick);

    </script>
</body>
