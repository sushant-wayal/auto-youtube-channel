name: Daily Video Generation Pipeline

on:
  # push:
  #   branches: [add-github-actions]  # Temporary: for testing on feature branch
  workflow_dispatch:
    inputs:
      video_idea:
        description: 'Custom video idea (optional - will use random from list if not provided)'
        required: false
        type: string
  schedule:
    - cron: '0 0 * * *'  # Run daily at 0 AM UTC

jobs:
  # Step 0: Check Redis queue and populate with AI-generated ideas if empty
  populate-ideas:
    name: Populate Ideas Queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check queue and run idea-selector if needed
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          npx tsx .github/scripts/check-and-populate-ideas.ts

  # Step 1: Generate video script
  generate-script:
    name: Generate Script
    needs: populate-ideas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      video_id: ${{ steps.script.outputs.video_id }}
      script_data: ${{ steps.script.outputs.script_data }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate script
        id: script
        env:
          WEBSITE_DOMAIN: ${{ secrets.WEBSITE_DOMAIN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          VIDEO_ID="video-$(date +%s)"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          
          # Generate script via API or local function
          # If custom idea provided, use it; otherwise fetch from Redis queue
          RESPONSE=$(npx tsx .github/scripts/generate-script.ts "${{ github.event.inputs.video_idea }}")
          echo "script_data=$RESPONSE" >> $GITHUB_OUTPUT

  # Step 2: Render scenes (runs in parallel with voice-over and thumbnail)
  render-scenes:
    name: Render Video Scenes
    needs: generate-script
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      clips_urls: ${{ steps.scenes.outputs.clips_urls }}
      clips_timings: ${{ steps.scenes.outputs.clips_timings }}
      animation_stop_times: ${{ steps.scenes.outputs.animation_stop_times }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxrandr2 libgbm1 \
            libpangocairo-1.0-0 libasound2t64

      - name: Install dependencies
        run: npm install

      - name: Render scenes
        id: scenes
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
        run: |
          npx tsx .github/scripts/render-scenes.ts "${{ needs.generate-script.outputs.video_id }}" >> $GITHUB_OUTPUT

  # Step 3: Generate voice-overs (runs in parallel with scene rendering)
  generate-voiceover:
    name: Generate Voice-overs
    needs: generate-script
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      voiceover_data: ${{ steps.voiceover.outputs.voiceover_data }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate voice-overs
        id: voiceover
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
        run: |
          npx tsx .github/scripts/generate-voiceover.ts "${{ needs.generate-script.outputs.video_id }}" >> $GITHUB_OUTPUT

  # Step 4: Generate thumbnail (runs in parallel with everything above)
  generate-thumbnail:
    name: Generate Thumbnail
    needs: generate-script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      thumbnail_url: ${{ steps.thumbnail.outputs.thumbnail_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate thumbnail
        id: thumbnail
        env:
          WEBSITE_DOMAIN: ${{ secrets.WEBSITE_DOMAIN }}
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
        run: |
          npx tsx .github/scripts/generate-thumbnail.ts "${{ needs.generate-script.outputs.video_id }}" >> $GITHUB_OUTPUT

  # Step 5: Assemble video
  assemble-video:
    name: Assemble Video
    needs: [generate-script, render-scenes, generate-voiceover]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      video_url: ${{ steps.assemble.outputs.video_url }}
      scene_durations: ${{ steps.assemble.outputs.scene_durations }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Assemble video
        id: assemble
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
          CLIPS_URLS: ${{ needs.render-scenes.outputs.clips_urls }}
          CLIPS_TIMINGS: ${{ needs.render-scenes.outputs.clips_timings }}
          ANIMATION_STOP_TIMES: ${{ needs.render-scenes.outputs.animation_stop_times }}
          VOICEOVER_URLS: ${{ needs.generate-voiceover.outputs.voiceover_data }}
        run: |
          RESULT=$(npx tsx .github/scripts/assemble-video.ts "${{ needs.generate-script.outputs.video_id }}")
          echo "$RESULT" >> $GITHUB_OUTPUT

  # Step 6: Upload to YouTube (waits for both assembly and thumbnail)
  upload-youtube:
    name: Upload to YouTube
    needs: [generate-script, assemble-video, generate-thumbnail]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      youtube_id: ${{ steps.upload.outputs.youtube_id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Upload to YouTube
        id: upload
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
          THUMBNAIL_URL: ${{ needs.generate-thumbnail.outputs.thumbnail_url }}
          VIDEO_URL: ${{ needs.assemble-video.outputs.video_url }}
          SCENE_DURATIONS: ${{ needs.assemble-video.outputs.scene_durations }}
        run: |
          RESULT=$(npx tsx .github/scripts/upload-youtube.ts)
          echo "$RESULT" >> $GITHUB_OUTPUT

  # Determine how many shorts to process and build the matrix indices array
  shorts-matrix-setup:
    name: Setup Shorts Matrix
    needs: [generate-script]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      short_indices: ${{ steps.matrix.outputs.short_indices }}

    steps:
      - name: Compute short indices from script data
        id: matrix
        env:
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
        run: |
          SHORT_INDICES=$(node -e "
            const data = JSON.parse(process.env.SCRIPT_DATA);
            const shorts = (data.script && data.script.shorts) || data.shorts || [];
            console.log(JSON.stringify(Array.from({length: shorts.length}, (_, i) => i)));
          ")
          echo "short_indices=$SHORT_INDICES" >> $GITHUB_OUTPUT
          echo "📱 Shorts to process: $SHORT_INDICES"

  # Process each short in parallel — one runner per short
  # Depends only on generate-script + shorts-matrix-setup so shorts start
  # immediately after script generation, independently of the long-form pipeline.
  process-short:
    name: "Process Short #${{ matrix.short_index }}"
    needs: [generate-script, shorts-matrix-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.shorts-matrix-setup.outputs.short_indices != '[]'
    strategy:
      fail-fast: false  # one short failing should not cancel siblings
      matrix:
        short_index: ${{ fromJson(needs.shorts-matrix-setup.outputs.short_indices) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxrandr2 libgbm1 \
            libpangocairo-1.0-0 libasound2t64

      - name: Install dependencies
        run: npm install

      - name: Process short ${{ matrix.short_index }}
        env:
          SHORT_INDEX: ${{ matrix.short_index }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SCRIPT_DATA: ${{ needs.generate-script.outputs.script_data }}
        run: |
          npx tsx .github/scripts/process-single-short.ts "${{ needs.generate-script.outputs.video_id }}"

  # Summary job
  pipeline-summary:
    name: Pipeline Summary
    needs: [populate-ideas, generate-script, render-scenes, generate-voiceover, assemble-video, upload-youtube, shorts-matrix-setup, process-short, generate-thumbnail]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Output summary
        run: |
          # Decode hex-encoded URLs
          VIDEO_URL=$(echo "${{ needs.assemble-video.outputs.video_url }}" | xxd -r -p)
          THUMBNAIL_URL=$(echo "${{ needs.generate-thumbnail.outputs.thumbnail_url }}" | xxd -r -p)
          
          echo "## Video Generation Pipeline Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Video ID:** ${{ needs.generate-script.outputs.video_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📺 YouTube Videos" >> $GITHUB_STEP_SUMMARY
          echo "**Main Video:** https://youtube.com/watch?v=${{ needs.upload-youtube.outputs.youtube_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Thumbnail:** $THUMBNAIL_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎬 Video Assets" >> $GITHUB_STEP_SUMMARY
          echo "**Assembled Video:** $VIDEO_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Populate Ideas: ${{ needs['populate-ideas'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Script Generation: ${{ needs['generate-script'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Scene Rendering: ${{ needs['render-scenes'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Voice-over Generation: ${{ needs['generate-voiceover'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Video Assembly: ${{ needs['assemble-video'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Thumbnail Generation: ${{ needs['generate-thumbnail'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- YouTube Upload: ${{ needs['upload-youtube'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Shorts Matrix Setup: ${{ needs['shorts-matrix-setup'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Shorts Processing (parallel): ${{ needs['process-short'].result }}" >> $GITHUB_STEP_SUMMARY
